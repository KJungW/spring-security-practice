spring:
  datasource:
    url: jdbc:h2:mem:database
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        # 소셜 로그인 등록자 설정
        registration:
          ## 네이버 소셜 로그인 등록자 설정
          naver:
            ### 등록할 소셜 로그인 서비스 이름
            client-name: naver
            ### 토큰 요청 인증 방식 설정 
            ### - 현재 설정은 POST 요청의 바디에 client-id와 client-secret를 담아 인증하는 방식
            client-authentication-method: client_secret_post
            ### 소셜 서버에서 발급받은 클라이언트 ID
            client-id: { 클라이언트_ID }
            ### 소셜 서버에서 발급받은 클라이언트 비밀번호
            client-secret: { 클라이언트_비밀번호 }
            ### 권한 서버에서 인증 코드를 전달하기 위한 리다이렉션 주소 (소셜 서버에 등록 필요)
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
            ### OAuth2의 인증 방식 설정
            authorization-grant-type: authorization_code
            ### OAuth2를 통해 제공 받을 데이터 범위
            scope: name,email
          ## 카카오 소셜 로그인 등록자 설정
          kakao:
            client-name: kakao
            client-authentication-method: client_secret_post
            client-id: { 클라이언트_ID }
            client-secret: { 클라이언트_비밀번호 }
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            scope: profile_nickname
          ## 구글 소셜 로그인 등록자 설정
          google:
            client-name: google
            client-authentication-method: client_secret_post
            client-id: { 클라이언트_ID }
            client-secret: { 클라이언트_비밀번호 }
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: profile,email
        # 소셜 로그인 제공자 설정
        provider:
          ## 네이버 로그인 제공자 설정
          naver:
            ### 사용자에게 제공할 로그인 페이지 URL
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            ### 인가 코드를 통해 토큰을 요청하는 URL
            token-uri: https://nid.naver.com/oauth2.0/token
            ### 토큰을 통해 사용자 정보를 요청하는 URL
            user-info-uri: https://openapi.naver.com/v1/nid/me
            ### 사용자 정보 요청의 응답에서 사용자 정보가 담긴 필드값
            user-name-attribute: response
          ## 카카오 로그인 제공자 설정
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          ## 구글 로그인 제공자 설정 (이미 내부적으로 세팅되어 있음)
security:
  jwt:
    token:
      secret-key: emN2cGdvcHdsZXcyNjIzNDEwYWthQCEjYXNkL3ZjeGtsa2x2eGNremxqMjAxNHNpZGchQFRTRE9TREFGS0x3cWxrZWprYWZhcw==
      access-expire-length: 600000
      refresh-expire-length: 86400000



